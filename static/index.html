<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EdgeChat-LAN · 局域网聊天</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- ============ 自动登录中 ============ -->
  <div id="authView">
    <div class="authCard">
      <h1>🛰️ EdgeChat-LAN</h1>
      <div class="sub">局域网部署版聊天系统 · 免登录</div>
      <div style="text-align:center;padding:20px 0;color:var(--muted);font-size:14px" id="authMsg">正在识别设备，自动进入聊天…</div>
      <div class="err" id="authErr" style="text-align:center"></div>
    </div>
  </div>

  <!-- ============ 主界面 ============ -->
  <div id="appView" class="hidden">
    <div class="sidebar">
      <div class="brand">
        <div class="dot"></div><span>EdgeChat-LAN</span>
      </div>
      <div class="navItems">
        <div class="navSec">频道</div>
        <div id="channelList"></div>
        <div class="navSec">私信</div>
        <div id="privateList"></div>
      </div>
      <div class="meBar" id="meBar" title="点击修改我的昵称" style="cursor:pointer">
        <div class="avatar" id="meAvatar">?</div>
        <div class="meta">
          <div id="meName" style="font-size:13px"></div>
          <div class="role" id="meRole"></div>
        </div>
      </div>
    </div>

    <div class="chat">
      <div class="chatHeader">
        <div>
          <div class="title" id="roomTitle">选择会话</div>
          <div class="topic" id="roomTopic"></div>
        </div>
        <div class="spacer"></div>
        <button class="btn sm ghost" onclick="showNewChannel()">＋新建频道</button>
      </div>
      <div class="pinnedBar hidden" id="pinnedBar"></div>
      <div class="msgList" id="msgList">
        <div style="color:var(--muted);text-align:center;margin-top:60px">← 选择一个频道，或点击右侧联系人发起私信</div>
      </div>
      <div class="typingHint" id="typingHint"></div>
      <div class="composer">
        <div class="replyBox hidden" id="replyBox"><span id="replyText"></span><a style="cursor:pointer"
            onclick="cancelReply()">✕ 取消回复</a></div>
        <div class="composeRow">
          <button class="iconBtn" title="上传文件/图片" onclick="fileInput.click()">📎</button>
          <input type="file" id="fileInput" class="hidden" onchange="uploadFile(this)">
          <textarea id="msgInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行，@用户名 提及成员"></textarea>
          <button class="sendBtn" onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>

    <div class="rightbar">
      <h3>成员 · 在线状态</h3>
      <div id="userList"></div>
    </div>
  </div>

  <script type="text/javascript" src="./script.js"></script>
</body>

</html>
